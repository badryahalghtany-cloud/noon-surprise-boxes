<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#130f30">
<title>صناديق مفاجآت نون 🎁</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#100d28;--white:#fff;--muted:#c4c1da;--gold:#ffd778;--violet:#bd93ff;--mint:#80efdf;--pink:#ff89b6}
*{box-sizing:border-box}html{min-height:100%;background:var(--bg)}body{margin:0;min-height:100vh;font-family:'Cairo',Tahoma,Arial,sans-serif;color:white;overflow-x:hidden;background:radial-gradient(ellipse at 10% 15%,#473070 0,transparent 35%),radial-gradient(ellipse at 91% 70%,#2a5670 0,transparent 35%),linear-gradient(145deg,#140e32,#110e2c 50%,#14102e);}
.sky{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}.star{position:absolute;width:4px;height:4px;border-radius:50%;background:#fff9;box-shadow:0 0 15px #fff9;animation:twinkle var(--d) ease-in-out infinite alternate}.star:nth-child(3n){width:2px;height:2px;background:#ffe2a8}
main{position:relative;z-index:1;width:min(1120px,95%);margin:auto;text-align:center;padding:32px 0 30px}
.logo{display:block;width:218px;max-width:74vw;height:auto;aspect-ratio:505/160;object-fit:contain;border-radius:15px;margin:0 auto 17px;background:#f7f8f4;box-shadow:0 10px 30px #0003}
.mini-title{color:#ffe2a0;font-weight:800;letter-spacing:.3px;font-size:14px}
h1{font-size:clamp(30px,5.6vw,58px);line-height:1.5;font-weight:900;margin:0;color:#fff;text-shadow:0 8px 38px #0006}
h1 span{background:linear-gradient(95deg,#ffe48e,#ffb3d5);-webkit-background-clip:text;background-clip:text;color:transparent}
.intro{max-width:680px;margin:8px auto 12px;font-size:clamp(16px,2.4vw,22px);font-weight:700;line-height:1.9;color:#f1e9ff}
.subintro{font-size:14px;color:#cabfe6;margin:0 auto 8px}
.progress{display:inline-flex;align-items:center;gap:7px;background:#ffffff10;border:1px solid #ffffff25;border-radius:50px;padding:7px 17px;margin:18px auto 0;font-size:13px;font-weight:700;color:#d9d3f5}
.progress b{color:#ffe099}
.boxes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;margin:32px 0 24px;align-items:stretch}
.box{position:relative;appearance:none;cursor:pointer;border:1px solid #ffffff39;background:linear-gradient(150deg,#ffffff16,#ffffff09 60%,#ffffff06);border-radius:28px;box-shadow:0 20px 45px #0706175c,inset 0 1px #ffffff2f;display:flex;flex-direction:column;align-items:center;padding:26px 12px 25px;color:white;min-height:330px;transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease;overflow:hidden;font-family:inherit;-webkit-tap-highlight-color:transparent}
.box::before{content:'';position:absolute;inset:-100% -40% auto;height:140%;transform:rotate(26deg);background:linear-gradient(90deg,transparent,#ffffff12,transparent);pointer-events:none;transition:top .5s}
.box:not(.locked):not(.opened):hover{transform:translateY(-8px) scale(1.015);border-color:var(--accent);box-shadow:0 26px 50px #0505169c,0 0 35px color-mix(in srgb,var(--accent) 25%,transparent)}
.box:not(.locked):not(.opened):hover::before{top:60%}
.box:focus-visible,.restart:focus-visible{outline:3px solid #fff;outline-offset:4px}
.box.locked{opacity:.51;cursor:not-allowed;filter:saturate(.5)}
.box.opened{border:2px solid var(--accent);background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 20%,#1b173b),#181332);transform:translateY(-4px);box-shadow:0 30px 65px #080618bd,0 0 38px color-mix(in srgb,var(--accent) 30%,transparent)}
.box-number{position:relative;font-weight:900;font-size:18px;z-index:1;margin-bottom:5px}
.chest-wrap{position:relative;width:175px;height:154px;margin:6px 0 12px;perspective:650px;display:flex;align-items:flex-end;justify-content:center}
.chest{position:relative;width:145px;height:102px;margin-bottom:10px;filter:drop-shadow(0 14px 12px #05031982);transform-origin:bottom center;transition:transform .4s ease}
.chest-front{position:absolute;z-index:2;left:0;bottom:0;width:100%;height:78px;border-radius:12px 12px 17px 17px;border:3px solid #2f204d;background:linear-gradient(115deg,var(--face1),var(--face2));box-shadow:inset 0 0 0 6px #ffffff15,inset 0 -12px 16px #0003}
.chest-front::before,.chest-front::after{content:'';position:absolute;top:0;bottom:0;width:13px;background:linear-gradient(#ffe2a0,#c58434);border:1px solid #8d5d2f}.chest-front::before{left:21px}.chest-front::after{right:21px}
.chest-lock{position:absolute;z-index:4;left:50%;bottom:35px;width:32px;height:32px;transform:translateX(-50%);background:linear-gradient(#fff4bd,#efaf40);border:3px solid #a77531;border-radius:9px;box-shadow:0 3px 4px #0003}
.chest-lock::before{content:'';display:block;width:8px;height:12px;position:absolute;left:9px;top:6px;border-radius:5px;background:#7f5a27}
.chest-lid{position:absolute;z-index:3;left:-5px;bottom:60px;width:155px;height:55px;background:linear-gradient(115deg,var(--lid1),var(--lid2));border:3px solid #2f204d;border-bottom:7px solid #dca64d;border-radius:70px 70px 10px 10px / 60px 60px 10px 10px;box-shadow:inset 0 6px 0 #ffffff30;transform-origin:0% 100%;transition:transform .75s cubic-bezier(.18,.85,.2,1.27),bottom .75s ease}
.chest-lid::before{content:'';position:absolute;top:2px;left:50%;bottom:0;width:17px;transform:translateX(-50%);background:linear-gradient(#ffe8ae,#ca903e);border-left:1px solid #ac772f;border-right:1px solid #ac772f}
.chest-glow{position:absolute;z-index:1;bottom:23px;width:105px;height:68px;background:var(--accent);filter:blur(35px);opacity:0;transition:opacity .4s}
.box.opened .chest-lid{transform:translate(-15px,-36px) rotate(-30deg)}.box.opened .chest-glow{opacity:.9}.box.opened .chest{animation:pop .85s both}
.box-cta{font-weight:800;font-size:17px;color:#fff;transition:opacity .2s}.box-hint{font-weight:600;font-size:12px;color:#e8defc91;margin-top:4px}
.prize{position:absolute;z-index:5;top:71px;left:50%;transform:translate(-50%,20px) scale(.4);opacity:0;pointer-events:none;transition:transform .6s cubic-bezier(.2,1.8,.4,1),opacity .25s}
.box.opened .prize{opacity:1;transform:translate(-50%,-16px) scale(1)}
.prize .amount{font-size:44px;font-weight:900;line-height:1;color:var(--accent);text-shadow:0 4px 13px #000b,0 0 22px var(--accent)}.prize .unit{font-size:13px;font-weight:900;background:#130d2ea8;white-space:nowrap;border-radius:20px;display:inline-block;padding:0 13px}
.box.opened .box-cta{color:var(--accent)}
.one{--accent:#ffcf68;--face1:#d77445;--face2:#7e3769;--lid1:#ec9753;--lid2:#9e4974}
.two{--accent:#a9c7ff;--face1:#655ee0;--face2:#3a3a93;--lid1:#8b7bee;--lid2:#4843a9}
.three{--accent:#90ebd8;--face1:#32a9a3;--face2:#256077;--lid1:#65d1bf;--lid2:#307e91}
.result{min-height:80px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;transition:opacity .3s}
.result-head{font-size:clamp(19px,3vw,27px);font-weight:900;color:#ffe9a9}.result-detail{font-size:14px;color:#d8cff1;font-weight:700}
.restart{font-family:inherit;cursor:pointer;border:0;border-radius:50px;background:linear-gradient(110deg,#ffe7a0,#f5b859);color:#2d2245;font-weight:900;font-size:17px;padding:11px 36px;box-shadow:0 12px 26px #01011650;transition:transform .2s,box-shadow .2s;margin:15px auto 4px}.restart:hover{transform:translateY(-2px);box-shadow:0 17px 30px #01011680}.restart[hidden]{display:none}
footer{color:#a7a0c7;font-size:12px;margin-top:20px}
.piece{position:fixed;top:-20px;left:0;width:10px;height:16px;border-radius:2px;z-index:10;pointer-events:none;animation:fall var(--time) linear forwards;transform:translate3d(0,0,0) rotate(0)}
@keyframes fall{to{transform:translate3d(var(--dx),110vh,0) rotate(var(--rot));opacity:0}}@keyframes twinkle{from{opacity:.1;transform:scale(.7)}to{opacity:1;transform:scale(1.6)}}@keyframes pop{0%{transform:scale(.95)}35%{transform:scale(1.1)}100%{transform:scale(1)}}
@media(max-width:690px){main{padding-top:18px}.boxes{grid-template-columns:1fr;gap:13px;margin:23px auto 18px;max-width:410px}.box{min-height:166px;display:grid;grid-template-columns:100px 1fr;grid-template-rows:35px 30px 30px;align-content:center;justify-items:start;text-align:right;column-gap:19px;padding:17px 24px 17px 15px}.chest-wrap{grid-column:1;grid-row:1/4;width:106px;height:112px;transform:scale(.7);transform-origin:top right;margin:0 0 -29px}.box-number{grid-column:2;grid-row:1;margin:0;align-self:end}.box-cta{grid-column:2;grid-row:2;align-self:end}.box-hint{grid-column:2;grid-row:3;align-self:end}.prize{left:72px;top:43px;transform:translate(-50%,16px) scale(.3)}.box.opened .prize{transform:translate(-50%,-20px) scale(.85)}.progress{margin-top:12px}h1{font-size:29px}.intro{font-size:16px}.subintro{font-size:12px}footer{margin-top:13px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>

  <div class="mini-title">✨ تحدي ملكات نون ✨</div>
  <h1>🎁 <span>صناديق المفاجآت</span> 🎁</h1>
  <p class="intro">قدّامكم ٣ صناديق، وكل صندوق يخفي مفاجأة مختلفة!</p>
  <p class="subintro">اختاري صندوقك بحماس… واكتشفي كم نقطة تنتظرك! 🌟</p>
  <div class="progress" id="status" aria-live="polite">🔒 <b>اختاري صندوقًا واحدًا</b> لتكتشفي المفاجأة</div>
  <section class="boxes" aria-label="الصناديق الثلاثة">
    <button class="box one" data-points="10" data-index="1" type="button" aria-label="فتح الصندوق الأول">
      <span class="box-number">الصندوق الأول</span>
      <span class="chest-wrap" aria-hidden="true"><span class="chest-glow"></span><span class="chest"><span class="chest-front"></span><span class="chest-lid"></span><span class="chest-lock"></span></span></span>
      <span class="prize"><span class="amount">١٠</span><span class="unit">نقاط ⭐</span></span>
      <span class="box-cta">🎀 افتحي الصندوق</span><span class="box-hint">اضغطي لاكتشاف المفاجأة</span>
    </button>
    <button class="box two" data-points="50" data-index="2" type="button" aria-label="فتح الصندوق الثاني">
      <span class="box-number">الصندوق الثاني</span>
      <span class="chest-wrap" aria-hidden="true"><span class="chest-glow"></span><span class="chest"><span class="chest-front"></span><span class="chest-lid"></span><span class="chest-lock"></span></span></span>
      <span class="prize"><span class="amount">٥٠</span><span class="unit">نقطة 🏆</span></span>
      <span class="box-cta">💎 افتحي الصندوق</span><span class="box-hint">اضغطي لاكتشاف المفاجأة</span>
    </button>
    <button class="box three" data-points="30" data-index="3" type="button" aria-label="فتح الصندوق الثالث">
      <span class="box-number">الصندوق الثالث</span>
      <span class="chest-wrap" aria-hidden="true"><span class="chest-glow"></span><span class="chest"><span class="chest-front"></span><span class="chest-lid"></span><span class="chest-lock"></span></span></span>
      <span class="prize"><span class="amount">٣٠</span><span class="unit">نقطة ✨</span></span>
      <span class="box-cta">🌸 افتحي الصندوق</span><span class="box-hint">اضغطي لاكتشاف المفاجأة</span>
    </button>
  </section>
  <div class="result" aria-live="polite" role="status"><div class="result-head" id="headline">الحظ الحلو ينتظر ملكات نون! 👑</div><div class="result-detail" id="detail">اختاري بحكمة… والمفاجأة راح تظهر لك 🎉</div></div>
  <button type="button" class="restart" id="restart" hidden>🔄 جولة جديدة</button>
  <footer>مدينة نون | تعلّم ومتعة ومفاجآت 💜</footer>
</main>
<script>
(function(){
  'use strict';
  const cards=Array.from(document.querySelectorAll('.box'));
  const status=document.getElementById('status'),headline=document.getElementById('headline'),detail=document.getElementById('detail'),restart=document.getElementById('restart'),sky=document.getElementById('sky');
  for(let i=0;i<34;i++){const s=document.createElement('i');s.className='star';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.setProperty('--d',(1.5+Math.random()*3)+'s');s.style.animationDelay='-'+(Math.random()*4)+'s';sky.appendChild(s)}
  let chosen=false;
  function confetti(){const colors=['#ffd779','#b593ff','#8be9de','#ffa1bc','#ffffff'];for(let i=0;i<85;i++){const c=document.createElement('span');c.className='piece';c.style.left=(5+Math.random()*90)+'vw';c.style.background=colors[i%colors.length];c.style.setProperty('--dx',(Math.random()*240-120)+'px');c.style.setProperty('--rot',(Math.random()*1200-600)+'deg');c.style.setProperty('--time',(2.3+Math.random()*2.1)+'s');c.style.animationDelay=(Math.random()*.5)+'s';document.body.appendChild(c);c.addEventListener('animationend',()=>c.remove(),{once:true})}}
  function sound(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const ctx=new C();[523,659,784,1047].forEach((hz,i)=>{const o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime+i*.105;o.type='sine';o.frequency.value=hz;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.075,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+.30);o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+.31)});setTimeout(()=>ctx.close(),900)}catch(e){}}
  cards.forEach(card=>card.addEventListener('click',()=>{
    if(chosen)return;chosen=true;const pts=Number(card.dataset.points);const ar=pts.toLocaleString('ar-SA');
    card.classList.add('opened');card.setAttribute('aria-label',`الصندوق المفتوح، ${ar} نقطة`);
    card.querySelector('.box-cta').textContent='🎉 يا سلام على الحظ!';card.querySelector('.box-hint').textContent='تم كشف المفاجأة';
    cards.filter(c=>c!==card).forEach(c=>{c.classList.add('locked');c.disabled=true});
    status.innerHTML='🎁 <b>انفتحت المفاجأة!</b> مبروك يا ملكة نون';
    headline.textContent=`🎊 مبروك! كسبتي ${ar} نقطة!`;
    detail.textContent='كل اختيار له مفاجأة… وأنتِ قدّها يا بطلة! 💖';
    restart.hidden=false;confetti();sound();
  }));
  restart.addEventListener('click',()=>{chosen=false;cards.forEach(c=>{c.classList.remove('opened','locked');c.disabled=false;c.setAttribute('aria-label',`فتح الصندوق ${['الأول','الثاني','الثالث'][Number(c.dataset.index)-1]}`);c.querySelector('.box-cta').textContent=['🎀 افتحي الصندوق','💎 افتحي الصندوق','🌸 افتحي الصندوق'][Number(c.dataset.index)-1];c.querySelector('.box-hint').textContent='اضغطي لاكتشاف المفاجأة'});status.innerHTML='🔒 <b>اختاري صندوقًا واحدًا</b> لتكتشفي المفاجأة';headline.textContent='الحظ الحلو ينتظر ملكات نون! 👑';detail.textContent='اختاري بحكمة… والمفاجأة راح تظهر لك 🎉';restart.hidden=true});
})();
</script>
